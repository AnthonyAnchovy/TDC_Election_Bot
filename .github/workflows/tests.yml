name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: decision-desk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: decision-desk/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Every module compiles
        run: python -m compileall -q .
      - name: Tests
        run: python -m pytest
      - name: Replay election night 2026
        run: python replay.py
