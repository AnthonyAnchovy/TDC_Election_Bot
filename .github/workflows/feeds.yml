name: feeds

# Every Monday, run the bot's own readers against each state's results site and the other sources it uses on
# election night (decision-desk/feedcheck.py). A state that changed its site shows up here as a red run and an
# open issue, months before the night, instead of as a feed that returns nothing at 8 PM.
# It also runs when a push changes a feed reader or the feed settings, so a change that breaks one shows up on its
# own branch. Only runs on the default branch open or close the issue.

on:
  schedule:
    - cron: "17 14 * * 1"      # Mondays, 14:17 UTC
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/feeds.yml"
      - "decision-desk/feedcheck.py"
      - "decision-desk/cw_feeds.py"
      - "decision-desk/results.py"
      - "decision-desk/results_sources.json"
      - "decision-desk/countywatch/feeds.json"
      - "decision-desk/packs/*/pack.json"

permissions:
  contents: read
  issues: write

jobs:
  feedcheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: decision-desk
    env:
      DESK_CAPTURE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: decision-desk/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Check every feed
        id: check
        run: |
          set +e
          python feedcheck.py --markdown --json feed_status.json > feed_report.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat feed_report.md >> "$GITHUB_STEP_SUMMARY"
          cat feed_report.md
          # each broken source as its own annotation, shown on the run's page
          python -c "import json; [print(f'::error title={r[\"kind\"]} {r[\"name\"]}::{r[\"detail\"]}') for r in json.load(open('feed_status.json'))['rows'] if r['status'] == 'FAIL']" || true
      - uses: actions/upload-artifact@v4
        with:
          name: feed-status
          path: |
            decision-desk/feed_status.json
            decision-desk/feed_report.md
      - name: Open or update the issue when something is broken
        if: steps.check.outputs.code != '0' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The weekly feed check found a source the bot can no longer read. Each FAIL row needs a look before the next election; \`python feedcheck.py\` in \`decision-desk/\` reruns it."
            echo
            cat feed_report.md
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > issue.md
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"Feed check: a results source is broken\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file issue.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Feed check: a results source is broken" --body-file issue.md
          fi
      - name: Close the issue when everything reads again
        if: steps.check.outputs.code == '0' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"Feed check: a results source is broken\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Every source reads again as of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          fi
      - name: Fail the run when something is broken
        if: steps.check.outputs.code != '0'
        run: exit 1
